services:
  usuarios:
    build: ./usuarios
    env_file: .env
    volumes:
      - usuarios_data:/app/data

  inventario:
    build: ./inventario
    env_file: .env
    volumes:
      - inventario_data:/app/data

  chamados:
    build: ./chamados
    env_file: .env
    environment:
      URL_USUARIOS: http://usuarios:8000
      URL_INVENTARIO: http://inventario:8000
    volumes:
      - chamados_data:/app/data
    depends_on:
      - usuarios
      - inventario

  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/web:/usr/share/nginx/html:ro
    depends_on:
      - usuarios
      - inventario
      - chamados

volumes:
  usuarios_data:
  inventario_data:
  chamados_data:
