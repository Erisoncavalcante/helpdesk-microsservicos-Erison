# VERSÃO DE TESTE: as portas 8001 a 8003 são temporárias, para testar cada serviço.
# Quando o gateway entrar, elas saem: só o gateway fica exposto.
services:
  usuarios:
    build: ./usuarios
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - usuarios_data:/app/data

  inventario:
    build: ./inventario
    env_file: .env
    ports:
      - "8002:8000"
    volumes:
      - inventario_data:/app/data

  chamados:
    build: ./chamados
    env_file: .env
    environment:
      URL_USUARIOS: http://usuarios:8000
      URL_INVENTARIO: http://inventario:8000
    ports:
      - "8003:8000"
    volumes:
      - chamados_data:/app/data
    depends_on:
      - usuarios
      - inventario

volumes:
  usuarios_data:
  inventario_data:
  chamados_data:
