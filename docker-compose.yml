services:
  helpdesk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - dados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  inventario:
    build: ./servicos/inventario
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"   # TEMPORÁRIO, só para testar
    volumes:
      - dados_inventario:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dados:
  dados_inventario:
