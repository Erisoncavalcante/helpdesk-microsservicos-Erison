services:
  # Único serviço com porta publicada: tudo entra pelo gateway
  gateway:
    build: ./servicos/gateway
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - usuarios
      - inventario
      - chamados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  usuarios:
    build: ./servicos/usuarios
    env_file: .env
    volumes:
      - dados_usuarios:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  inventario:
    build: ./servicos/inventario
    env_file: .env
    volumes:
      - dados_inventario:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  chamados:
    build: ./servicos/chamados
    env_file: .env
    volumes:
      - dados_chamados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dados_usuarios:
  dados_inventario:
  dados_chamados:
