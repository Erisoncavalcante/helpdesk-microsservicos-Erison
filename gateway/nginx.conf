server {
    listen 80;

    # Saúde: o gateway mostra quais serviços estão no ar
    location = /saude          { default_type application/json; return 200 '{"status":"ok","servico":"gateway"}'; }
    location = /saude/usuarios   { proxy_pass http://usuarios:8000/saude; }
    location = /saude/inventario { proxy_pass http://inventario:8000/saude; }
    location = /saude/chamados   { proxy_pass http://chamados:8000/saude; }
    
    # Tela (arquivos estáticos)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Usuários
    location /auth     { proxy_pass http://usuarios:8000; }
    location /usuarios { proxy_pass http://usuarios:8000; }

    # Inventário
    location /ativos   { proxy_pass http://inventario:8000; }

    # Chamados (inclui /chamados/painel, /atribuir e /status)
    location /chamados { proxy_pass http://chamados:8000; }

    # Notificações: hoje o módulo vive dentro do chamados
    location /notificacoes { proxy_pass http://chamados:8000; }
}